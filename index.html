<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGITAL ARC | V2.0 PRO</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
 
    <style>
        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body, html {
            height: 100%;
            background: #f9f9f7;
            color: #111;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }
 
        /* --- SUBTLE GRAIN TEXTURE --- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
        }
 
        /* --- TOP BAR --- */
        .sys-bar {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 40px;
            background: #fff;
            border-bottom: 1px solid #ebebeb;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px;
            z-index: 400;
            font-size: 9px;
            letter-spacing: 2.5px;
            color: #bbb;
            font-weight: 500;
            text-transform: uppercase;
        }

        /* --- FLOATING CHAT TRIGGER --- */
        .floating-chat {
            position: fixed;
            bottom: 40px;
            right: 30px;
            z-index: 500;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            background: #fff;
            padding: 10px 20px;
            border: 1px solid #ebebeb;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .floating-chat:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        .chat-dot {
            width: 8px; height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .chat-text {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #111;
            font-weight: 500;
        }
 
        /* --- SPLIT LAYOUT --- */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            padding-top: 40px;
        }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
        }
 
        .section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px 30px;
            transition: background 0.4s ease;
            border: 1px solid #ebebeb;
            overflow: hidden;
        }
 
        .ppt-studio:hover { background: rgba(184, 134, 11, 0.04); }
        .tech-forge:hover { background: rgba(26, 107, 181, 0.04); }
 
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6vw, 3.8rem);
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .ppt-studio h1 { color: #b8860b; }
        .tech-forge h1 { color: #1a6bb5; }
 
        .section-sub {
            font-size: 9px;
            letter-spacing: 4px;
            color: #ccc;
            text-transform: uppercase;
            margin-bottom: 32px;
        }
 
        .btn-action {
            background: #111;
            color: #fff;
            border: none;
            padding: 12px 34px;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            border-radius: 1px;
            transition: all 0.2s;
        }
        .ppt-studio .btn-action { background: #b8860b; }
        .tech-forge .btn-action { background: #1a6bb5; }

        /* --- MODAL --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none; justify-content: center; align-items: center;
            z-index: 600;
            backdrop-filter: blur(15px);
        }
 
        .modal {
            background: #fff;
            border: 1px solid #eee;
            width: 92%;
            max-width: 440px;
            padding: 40px;
            border-radius: 2px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.04);
        }

        #modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            font-size: 8px;
            letter-spacing: 3px;
            color: #bbb;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
 
        input, textarea {
            width: 100%;
            background: #fff;
            border: 1px solid #eee;
            padding: 14px;
            color: #111;
            margin-bottom: 20px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus { border-color: #111; }

        #main-submit {
            width: 100%;
            background: #111;
            color: #fff;
            border: none;
            padding: 16px;
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
 
    <div class="sys-bar">
        <div>DIGITAL ARC · V2.0 PRO</div>
        <div>AVAILABILITY: BESPOKE COMMISSIONS</div>
    </div>

    <a href="https://m.me/61587460312431" target="_blank" class="floating-chat">
        <span class="chat-dot"></span>
        <span class="chat-text">Consult via Messenger</span>
    </a>
 
    <div class="container">
        <section class="section ppt-studio">
            <h1>PPT Studio</h1>
            <p class="section-sub">Narrative Design</p>
            <button class="btn-action" onclick="openModal('ppt')">Start Brief</button>
        </section>
 
        <section class="section tech-forge">
            <h1>Tech Forge</h1>
            <p class="section-sub">Web Engineering</p>
            <button class="btn-action" onclick="openModal('tech')">Initiate Build</button>
        </section>
    </div>
 
    <div id="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Module</h3>
            <p style="font-size: 10px; color: #888; margin-bottom: 30px; letter-spacing: 1px;">Fill out the brief. We will discuss the package tier and pricing via Messenger once transmitted.</p>
 
            <form id="orderForm" onsubmit="handleForm(event)">
                <label class="field-label">Name</label>
                <input type="text" id="from_name" placeholder="Name or Organization" required>
 
                <label class="field-label">Contact Email</label>
                <input type="email" id="reply_to" placeholder="email@address.com" required>
 
                <label class="field-label">Project Brief</label>
                <textarea id="project_notes" placeholder="Tell me about what you need to build..." required></textarea>
 
                <button type="submit" id="main-submit">Transmit & Open Chat</button>
                <button type="button" onclick="closeModal()" style="width:100%; background:none; border:none; color:#ccc; font-size:8px; letter-spacing:2px; margin-top:20px; cursor:pointer; text-transform:uppercase;">Cancel Request</button>
            </form>
        </div>
    </div>
 
    <script>
        const EMAILJS_PUBLIC_KEY = "X3QQWiJUeGkip5zuI";
        const EMAILJS_SERVICE_ID = "service_50mw7el";
        const EMAILJS_TEMPLATE_ID = "template_f1i8toh";
        let currentSvc = 'ppt';
 
        (function() { emailjs.init(EMAILJS_PUBLIC_KEY); })();
 
        function openModal(svc) {
            currentSvc = svc;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('modal-title').textContent = svc === 'ppt' ? 'PPT Brief' : 'Tech Build';
        }
 
        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }
 
        function handleForm(e) {
            e.preventDefault();
            const btn = document.getElementById('main-submit');
            btn.textContent = 'TRANSMITTING...';
            btn.disabled = true;
 
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                service_type: currentSvc.toUpperCase(),
                from_name: document.getElementById('from_name').value,
                reply_to: document.getElementById('reply_to').value,
                project_notes: document.getElementById('project_notes').value,
                status: "CHAT_PENDING"
            }).then(() => {
                // Success - Redirect to Messenger
                window.location.href = "https://m.me/61587460312431";
            }).catch(() => {
                alert("Transmission failed. Redirecting to chat...");
                window.location.href = "https://m.me/61587460312431";
            });
        }
    </script>
</body>
</html>
